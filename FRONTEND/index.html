<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Ransh Sports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Ransh Sports home"
          ><span class="brand-mark" aria-hidden="true">R</span
          ><span>Ransh <strong>Sports</strong></span></a
        >
        <div class="topbar-meta">
          <span class="live-dot"></span
          ><span id="connection-label">Connecting</span>
        </div>
      </header>
      <main>
        <section class="intro">
          <div>
            <p class="eyebrow">Live sports index</p>
            <h1>Find the next<br /><em>big moment.</em></h1>
          </div>
          <p class="intro-copy">
            A clear view of tournaments and upcoming fixtures, sourced directly
            from your sports data services.
          </p>
        </section>
        <section class="controls" aria-label="Sports controls">
          <div
            id="sport-tabs"
            class="sport-tabs"
            role="tablist"
            aria-label="Sports"
          ></div>
          <div class="control-row">
            <label class="date-field"
              >Date <input id="match-date" type="date" /></label
            ><label class="search-field"
              ><span aria-hidden="true">⌕</span
              ><input
                id="search-input"
                type="search"
                placeholder="Search tournaments"
                autocomplete="off" /></label
            ><button
              id="refresh-button"
              class="icon-button"
              type="button"
              title="Refresh data"
              aria-label="Refresh data"
            >
              ↻
            </button>
          </div>
        </section>
        <div id="global-message" class="message" role="status" hidden></div>
        <section id="dashboard" aria-live="polite">
          <div class="loading-state">
            <span class="spinner"></span><span>Loading the sports desk...</span>
          </div>
        </section>
      </main>
      <footer>
        <span>RANSH / SPORTS DESK</span
        ><span id="last-updated">Waiting for data</span>
      </footer>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
